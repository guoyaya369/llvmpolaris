name: Build Polaris LLVM 16.0.6 for Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-polaris:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        repository: za233/Polaris-Obfuscator
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure CMake
      run: |
        cmake -S src/llvm -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DLLVM_ENABLE_PROJECTS="clang" `
          -DLLVM_TARGETS_TO_BUILD="X86" `
          -DLLVM_ENABLE_ASSERTIONS=Off

    - name: Build clang
      run: |
        cmake --build build --config Release --target clang -j $env:NUMBER_OF_PROCESSORS

    - name: Package artifacts
      run: |
        mkdir upload
        copy build\Release\bin\clang.exe upload\
        copy build\Release\bin\clang-cl.exe upload\

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: polaris-toolchain
        path: upload/
